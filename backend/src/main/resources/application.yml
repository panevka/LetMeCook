spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/letmecookdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        ddl-auto: update
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: "true"
  security:
    oauth2:
      client:
        registration:
          discord:
            redirect-uri: "{baseUrl}/login/oauth2/code/discord"
            authorization-grant-type: authorization_code
            client-id: ${OAUTH_DISCORD_CLIENT_ID}
            client-name: ${OAUTH_DISCORD_CLIENT_NAME}
            client-secret: ${OAUTH_DISCORD_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope: [identify]
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discordapp.com/api/users/@me
            user-name-attribute: username

jwt:
  secret: { JWT_TOKEN_SECRET }
  expirationMs: 86400000 # 24 hours in milliseconds
server:
  port: 8080

logging:
  level:
    org:
      springframework:
        web: DEBUG
        security: DEBUG
        security.web.access.intercept: DEBUG
        security.oauth2: DEBUG
