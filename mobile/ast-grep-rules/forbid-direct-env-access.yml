id: forbid-direct-env-access-ts
message: "Direct process.env access is not allowed. 
          The env access should be obtained only via specialized object wrapper.
          Verify if the codebase has one, otherwise create it."
severity: error
language: typescript
rule:
  pattern: process.env
ignores:
  - "src/features/env/internal/*"
